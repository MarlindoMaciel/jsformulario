<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>JsFormulário Dinâmico</title>

    <link rel="stylesheet" href="./style.css">
    <script src="./script.js"></script>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <form id="myForm">
        <div class="toolbar">
            <div class="brand">
                <div class="brand-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="#fff" style="width:18px;height:18px">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M11.35 3.836c-.065.21-.1.433-.1.664 0 .414.336.75.75.75h4.5a.75.75 0 0 0 .75-.75 2.25 2.25 0 0 0-.1-.664m-5.8 0A2.251 2.251 0 0 1 13.5 2.25H15c1.012 0 1.867.668 2.15 1.586m-5.8 0c-.376.023-.75.05-1.124.08C9.095 4.01 8.25 4.973 8.25 6.108V8.25m8.9-4.414c.376.023.75.05 1.124.08 1.131.094 1.976 1.057 1.976 2.192V16.5A2.25 2.25 0 0 1 18 18.75h-2.25m-7.5-10.5H4.875c-.621 0-1.125.504-1.125 1.125v11.25c0 .621.504 1.125 1.125 1.125h9.75c.621 0 1.125-.504 1.125-1.125V18.75m-7.5-10.5h6.375c.621 0 1.125.504 1.125 1.125v9.375m-8.25-3 1.5 1.5 3-3.75" />
                    </svg>
                </div>
                JsFormulário
            </div>
            <div class="container-flex">
                <button type="button" class="btn-ghost" onclick="exportFormulario()">Exportar   </button>
                <button type="button" class="btn-ghost" onclick="importFormulario()">Importar   </button>
                <button type="button" class="btn-ghost" onclick="addCampo()"        >Adicionar  </button>                
            </div>
        </div>
        <div class="container">
            <div id="pagina"></div>
            <div style="display: flex; justify-content: flex-end;">
                <button type="button" class="btn-ghost" onclick="saveDados()">Salvar dados</button>
            </div>
        </div>
    </form>
    <div id="lista" class="container"></div>
    <input  type="file" id="fileInput" accept=".json" style="display:none" onchange="loadFile(event)">
</body>
</html>
